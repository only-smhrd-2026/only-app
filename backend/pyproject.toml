[project]
name = "only-app-backend"
version = "0.1.0"
description = "하루한장 서버 (FastAPI)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.12",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "apscheduler>=3.10,<4",
    "pillow>=10.4",
    "pillow-heif>=0.18",
    "boto3>=1.35",
    "anthropic>=0.40",
    "httpx>=0.27",  # Workers AI 그림(app/ai/image.py). STT·TTS REST 도 이것으로
    "websockets>=17.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# DTZ: naive datetime 금지 (설계 결정 D12, 시간대 Asia/Seoul 1곳 고정)
select = ["E", "F", "I", "DTZ"]

[tool.pytest.ini_options]
testpaths = ["tests"]
